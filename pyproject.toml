[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage-tracker"
version = "0.1.0"
description = "Local-first Codex token usage tracking by Git project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
codex-usage = "codex_usage.cli:main"

[project.urls]
Repository = "https://github.com/shotgun1107/codex-usage-tracker"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/codex-usage-tracker/schemas" = ["schemas/ledger-event-v1.schema.json"]
